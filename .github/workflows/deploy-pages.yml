name: Publicar H.S. Bruno no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "H.S Bruno/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: "H.S Bruno"

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
